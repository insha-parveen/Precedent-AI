services:
  db:
    image: pgvector/pgvector:pg16
    container_name: precedent-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: precedent
      POSTGRES_PASSWORD: precedent
      POSTGRES_DB: precedent
    ports:
      # Mapped to 5434 on the host so this doesn't collide with a local Postgres
      # already listening on 5432 or 5433.
      - "5434:5432"
    volumes:
      - precedent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U precedent -d precedent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  precedent_pgdata:
