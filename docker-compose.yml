services:
  db:
    image: pgvector/pgvector:pg16
    container_name: precedent-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: precedent
      POSTGRES_PASSWORD: precedent
      POSTGRES_DB: precedent
    ports:
      # Mapped to 5435 on the host so this does not collide with other Postgres
      # already listening on 5432 or 5433.
      - "5435:5432"
    volumes:
      - precedent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U precedent -d precedent"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: precedent-api
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://precedent:precedent@db:5432/precedent
      - PRECEDENT_ENV=dev
      - LOG_LEVEL=DEBUG
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./db:/app/db
      - ./skills:/app/skills

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: precedent-web
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://api:8000
      - NEXT_PUBLIC_API_BASE=/api
      - NEXT_PUBLIC_BACKEND_URL=http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./web/src:/app/src
      - ./web/public:/app/public

volumes:
  precedent_pgdata:
