[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[project]
name = "precedent"
version = "0.1.0"
description = "Retrieval-first contract-intelligence agent, architecturally modeled on DeepJudge."
requires-python = ">=3.11"

[project.scripts]
precedent = "precedent.cli:main"

[tool.setuptools]
packages = ["precedent"]
package-dir = {"" = "src"}


